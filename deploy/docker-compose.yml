# Tier-1 single-node deploy: one app container + a Caddy reverse proxy that
# terminates HTTPS automatically (replaces the Cloudflare tunnel). Run artifacts
# and the shared parts registry live on named volumes so they survive restarts
# and redeploys.
#
#   FL_HOST=compose.firstlight.build docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4500
      # secrets injected from the host env / a .env file next to this compose:
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FL_LLM_ORDER=${FL_LLM_ORDER:-anthropic,openai,claude-cli}
      # operator shell OFF by default in the cloud; admins set to 1 knowingly
      - FL_TERMINAL=${FL_TERMINAL:-0}
      - FL_ADMIN_EMAILS=${FL_ADMIN_EMAILS:-}
      # Proxy-hybrid LLM: the `claude-cli` leg shells out to this shim, which
      # forwards to the Mac's subscription `claude` over the tunnel. BYOK users
      # hit their own metered key first and never reach it; only admin/no-BYOK
      # runs use the subscription. Unset these and the claude-cli leg no-ops.
      - CLAUDE_CLI_PATH=${CLAUDE_CLI_PATH:-}
      - FL_MAC_PROXY_URL=${FL_MAC_PROXY_URL:-}
      - FL_MAC_PROXY_SECRET=${FL_MAC_PROXY_SECRET:-}
    volumes:
      - runs:/app/software/prompt-to-pcb-ui/public/runs
      - registry:/app/tools/parts
      # box-side `claude` shim (proxy hybrid) — see deploy/claude-shim.py
      - ./claude-shim.py:/usr/local/bin/claude-proxy:ro
    expose:
      - "4500"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - FL_HOST=${FL_HOST:?set FL_HOST to the public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  runs:
  registry:
  caddy_data:
  caddy_config:
