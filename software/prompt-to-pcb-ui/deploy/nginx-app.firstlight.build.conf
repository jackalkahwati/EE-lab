# app.firstlight.build — FirstLight Compose (nginx alternative to Caddy)
# Use this ONLY if the VM already runs nginx on 80/443 (you can't bind both
# nginx and Caddy to 443). Steps:
#   sudo cp deploy/nginx-app.firstlight.build.conf /etc/nginx/sites-available/app.firstlight.build
#   sudo ln -s /etc/nginx/sites-available/app.firstlight.build /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.firstlight.build   # provisions TLS + rewrites this file
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.firstlight.build;
    # certbot will add the 443 server block + redirect after you run it.

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Compose uses EventSource (SSE) for pipeline runs — don't buffer.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
